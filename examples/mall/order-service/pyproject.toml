[project]
name = "order-service"
version = "0.1.0"
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/order"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-m 'not known_failure'"
markers = ["known_failure: 故意失败的用例，默认排除在门禁之外"]
